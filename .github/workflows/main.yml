name: API CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: List test files
        run: npx jest --listTests
      - name: Run all tests and enforce 70 percent coverage
        run: npm test -- --verbose --json --outputFile=report/test-results.json
      - name: Check deployment ordering and rollback
        run: bash scripts/test-deploy.sh
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/
            report/test-results.json
            report/validation.md
  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-ec2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: ec2-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ec2
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ec2 ~/.ssh/known_hosts
      - name: Deploy verified commit
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USERNAME || secrets.EC2_USER }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DOCKER_USER" =~ ^[a-z0-9]+$ ]]
          target="$EC2_USER@$EC2_HOST"
          printf '%s' "$DOCKER_TOKEN" | ssh -i ~/.ssh/id_ec2 -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "$target" "docker login -u '$DOCKER_USER' --password-stdin"
          scp -i ~/.ssh/id_ec2 -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 scripts/deploy.sh "$target:~/deploy-api.sh"
          ssh -i ~/.ssh/id_ec2 -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "$target" "bash ~/deploy-api.sh '$DOCKER_USER/backend-api:$SHA' '$SHA'"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ec2
